services:
  - type: web
    name: codetogether-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EXECUTOR
        value: local
      - key: RUN_TIMEOUT_MS
        value: 5000
      - key: RUN_MEMORY_MB
        value: 256
      - key: RUN_OUTPUT_LIMIT_KB
        value: 64
      - key: RUN_CONCURRENCY
        value: 2
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
